<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="3">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vimana — starting up…</title>
<style>
  :root {
    color-scheme: light dark;
    --navy: #0A1626;
    --cyan: #58B0D9;
    --amber: #FF7A2F;
    --ivory: #F8F7F4;
    --text: #111827;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--ivory);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    text-align: center;
    background: white;
    border: 1px solid rgba(10, 22, 38, 0.08);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 8px 32px rgba(10, 22, 38, 0.06);
  }
  .icon {
    display: inline-block;
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--navy) 100%);
    color: white;
    font-size: 32px;
    line-height: 64px;
    margin-bottom: 20px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.05); opacity: 0.85; }
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 14px;
    line-height: 1.5;
    color: rgba(10, 22, 38, 0.6);
    margin: 8px 0;
  }
  .dots {
    display: inline-block;
    width: 30px;
    text-align: left;
  }
  .dots::after {
    content: '';
    animation: dots 1.5s steps(4) infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
  }
  .hint {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: rgba(10, 22, 38, 0.35);
    margin-top: 20px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: var(--navy); color: #E5E7EB; }
    .card { background: #0F1E32; border-color: rgba(255,255,255,0.08); }
    h1 { color: white; }
    p, .hint { color: rgba(255,255,255,0.6); }
  }
</style>
</head>
<body>
  <div class="card" role="alert" aria-live="polite">
    <div class="icon" aria-hidden="true">✈️</div>
    <h1>Vimana</h1>
    <p>Взлётная полоса готовится<span class="dots"></span></p>
    <p>Runway is warming up<span class="dots"></span></p>
    <p class="hint">This page will refresh automatically.</p>
  </div>
</body>
</html>
