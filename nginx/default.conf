resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name vimana.dealvault.club;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name vimana.dealvault.club;

    ssl_certificate /etc/letsencrypt/live/vimana.dealvault.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vimana.dealvault.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Upload limit for DealVault attachments
    client_max_body_size 15M;

    # Retry transient upstream failures (backend restarting, DNS re-resolve, etc)
    # before returning 5xx. Works even with a single upstream — nginx re-attempts
    # the same target through DNS.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;
    proxy_connect_timeout 3s;

    # Custom "warming up" page shown while backend/frontend are still booting
    # (typical: 15-30 sec after `docker compose up`). Auto-refreshes.
    error_page 502 503 504 = /_error.html;
    location = /_error.html {
        root /etc/nginx/errors;
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(health|docs|openapi.json) {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $frontend_upstream "frontend:5173";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 86400;
    }
}
