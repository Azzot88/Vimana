resolver 127.0.0.11 valid=10s ipv6=off;

# T_SEC.1 — hide nginx version from response headers.
server_tokens off;

# T_SEC.1 — rate-limit zones. login is strict (brute-force target); register
# is looser (nothing to guess, and e2e smoke suite bursts N registrations).
#
# The names are historical: since `T3.28` there is no `/auth/register`, and
# both zones are applied to the doors that replaced it — `otp/request` and
# `otp/verify`. Kept rather than renamed because a zone name appears in
# `limit_req` lines and in nothing else, and renaming it would edit five places
# to say the same thing. What matters is written where they are used.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=register_zone:10m rate=60r/m;
# T3.11 — email confirmation codes. Tighter than login/register on purpose:
# one layer guards the mailbox from being used as a spam cannon, the other
# (slowapi, per user id) guards a single account. Both are needed — nginx sees
# IPs and cannot tell accounts apart, slowapi sees accounts and cannot stop a
# rotating-IP flood against many of them.
limit_req_zone $binary_remote_addr zone=email_verify_zone:10m rate=10r/m;
# T3.13 — Nostr key login/signup. Same reasoning as the email zone: slowapi
# limits per account, nginx limits per IP, and neither alone covers the other's
# blind spot. Handing out challenges is cheap but must not become a free
# signature-collection loop.
limit_req_zone $binary_remote_addr zone=nostr_auth_zone:10m rate=10r/m;
# T3.14 — passkeys get their own zone rather than sharing the Nostr one: a
# ceremony is always two requests (options, then verify) plus a list refresh, so
# sharing meant one flow could starve the other. 30r/m absorbs a few honest
# retries; the account-level limits in slowapi are what actually bound abuse.
limit_req_zone $binary_remote_addr zone=passkey_zone:10m rate=30r/m;
# T_SEC.4 — relay connections. One request per websocket handshake, so this
# bounds reconnect storms, not traffic on an open socket; strfry's own limits
# handle what happens once a client is in.
limit_req_zone $binary_remote_addr zone=relay_zone:10m rate=30r/m;
# T3.16 — recovery codes. The tightest zone here: a code is the last door into
# an account that may have no other, and unlike a password it is guessed
# against a known-length alphabet. slowapi limits the same route per account;
# this one stops a rotating attempt against many accounts from one address.
limit_req_zone $binary_remote_addr zone=recovery_zone:10m rate=5r/m;

# Websocket upgrade needs `Connection: upgrade` on the way in and nothing at all
# on ordinary requests — a literal `Connection: upgrade` would break keepalive
# for every non-websocket call proxied through the same server block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name vimana.dealvault.club;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name vimana.dealvault.club;

    ssl_certificate /etc/letsencrypt/live/vimana.dealvault.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vimana.dealvault.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # T_SEC.1 — security headers on every response.
    # HSTS: force HTTPS for 1 year (includes subdomains, preload-eligible).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Clickjacking guard.
    add_header X-Frame-Options "DENY" always;
    # MIME sniffing off.
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer minimal (privacy).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions-Policy: disable browser APIs we don't need.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # T_SEC.2 — production CSP after switching frontend to static bundle.
    # script-src: drop 'unsafe-inline' + 'unsafe-eval' (Vite prod bundle is
    #   ES modules only, no eval, no inline scripts).
    # style-src: keep 'unsafe-inline' — Tailwind + third-party UI libs still
    #   inject <style> tags at runtime. Full nonce/hash pass — future work.
    # fonts.googleapis.com / fonts.gstatic.com allowlisted for Space Grotesk /
    # Inter / IBM Plex Mono per DESIGNGUIDELINES. Self-hosting fonts — future.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Upload limit for DealVault attachments
    client_max_body_size 15M;

    # Retry transient upstream failures (backend restarting, DNS re-resolve, etc)
    # before returning 5xx. Works even with a single upstream — nginx re-attempts
    # the same target through DNS.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;
    proxy_connect_timeout 3s;

    # 429, not the default 503, when a rate limit trips. "Too many requests" is
    # what actually happened; "service unavailable" sends the client looking for
    # an outage. It also keeps rate limiting out of the 5xx error_page below.
    limit_req_status 429;

    # NOTE: the friendly HTML error page is attached to the SPA location only
    # (see `location /` near the bottom), never at server level. `error_page
    # ... = /page` rewrites the status to that of the page — i.e. **200** — so a
    # server-level rule made every rate-limited or backend-down API call answer
    # `200` with an HTML body. Clients read that as success: on 2026-07-29 a
    # throttled passkey login returned 200, the frontend stored `undefined` as
    # its token, and the next call 401'd with no clue why.
    location = /_error.html {
        root /etc/nginx/errors;
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # T_SEC.1 — deny common probe/scan paths at nginx level so they never
    # reach the app. Attackers routinely scan for these; keep noise out of logs.
    location ~* /\.env(\..*)?$ { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
    location ~ /\.svn { deny all; return 404; }
    location ~* \.(php|php3|php4|php5|phtml|aspx?|jsp|cgi)$ { deny all; return 404; }
    location ~* /(wp-admin|wp-login|wp-content|xmlrpc\.php) { deny all; return 404; }
    location ~ /\.ht { deny all; return 404; }

    # T_SEC.1 — brute force guard on auth endpoints (burst=5 = allow small
    # spikes, nodelay = reject overflow immediately without queueing).
    # E2E chains register→login→me so login gets called as often as register.
    location = /api/auth/login {
        limit_req zone=login_zone burst=10 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # T3.27/T3.29 — the doors these zones were written for **moved**, and the
    # guard did not follow (found 2026-08-11 auditing the PRD).
    #
    # `POST /auth/register` went in `T3.28 pt.3b` a month ago. Its
    # `location` block sat here protecting nothing, while the thing that
    # replaced it — `otp/request`, the public form that mints codes — fell
    # through to the generic `/api/` block with **no nginx zone at all**. The
    # app-side budgets from `T3.29` were carrying the whole load alone, and the
    # two-layer rule exists precisely so that neither layer has to.
    #
    # Remapped by role rather than by name: `otp/request` is the registration
    # door now, `otp/verify` is the sign-in door, and they get the zones those
    # roles always had.
    location = /api/auth/otp/request {
        limit_req zone=register_zone burst=10 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Where a six-digit code is guessed. Same zone as the password door, for the
    # same reason: both are attempts to enter an account.
    location = /api/auth/otp/verify {
        limit_req zone=login_zone burst=10 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/auth/passkey/ {
        limit_req zone=passkey_zone burst=10 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/auth/nostr/ {
        limit_req zone=nostr_auth_zone burst=5 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/auth/recovery/ {
        limit_req zone=recovery_zone burst=3 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/auth/email/ {
        limit_req zone=email_verify_zone burst=5 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /health stays public (docker healthcheck).
    # /docs and /openapi.json are gated by the app via EXPOSE_DOCS env — in
    # prod (`EXPOSE_DOCS=false`) FastAPI returns 404 for those paths itself.
    # T_OPS.1 — `/ready` sits next to `/health` because a balancer needs both
    # and they answer different questions: alive versus should-get-traffic. A
    # draining process answers 200 here and 503 there, which is the state that
    # makes a deploy lose nothing. Reachable from outside so that whatever ends
    # up in front — nginx upstream checks, HAProxy, Traefik, a managed balancer
    # — can read it without knowing anything about this compose file.
    location ~ ^/(health|ready|docs|redoc|openapi.json) {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # T_SEC.4 — Vimana Nostr relay over TLS: `wss://vimana.dealvault.club/relay`.
    #
    # Why through nginx at all: strfry speaks plain `ws://` on 7777, and a Nostr
    # client running on an https page cannot open a `ws://` socket — browsers
    # block it as mixed content. Publishing 7777 to the world therefore produced
    # an address no web client could use, which is why the Phase 3.5 check
    # ("visible from damus/coracle") could not pass however well the relay ran.
    #
    # A path on the existing certificate rather than a `relay.` subdomain: a
    # relay is addressed by full URL, so the path costs nothing, while the
    # subdomain would need its own DNS record and its own certificate renewal.
    # Moving to one later is a server block, not a redesign.
    #
    # Same `set $var` + resolver trick as every other upstream here: the relay
    # runs under a compose profile and is often absent, and a literal name would
    # stop nginx from starting at all when it cannot be resolved.
    location /relay {
        limit_req zone=relay_zone burst=10 nodelay;

        set $relay_upstream "nostr-relay:7777";
        proxy_pass http://$relay_upstream/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Relay sockets are long-lived by design — a subscription can sit idle
        # for minutes between events. The default 60s read timeout would close
        # them from our side and leave clients reconnecting in a loop.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # T3.24 — the Identity Vault reader is one self-contained file, which means
    # its script is inline, which the site-wide `script-src 'self'` forbids. The
    # page therefore gets its own policy, and the trade is worth naming: we give
    # up `unsafe-inline` on this one path and take back something stronger in
    # exchange — `connect-src 'none'` makes "nothing is sent anywhere" a rule
    # the browser enforces, not a sentence we wrote on the page.
    #
    # Everything else is shut off: no images, no fonts, no frames, no forms.
    # The reader reads a local file and does arithmetic; it needs nothing.
    location = /reader.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        set $frontend_upstream "frontend:80";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        # Friendly "warming up" page while the frontend container boots — here
        # and only here. A human looking at a blank page benefits from it; an
        # API client needs the real status code instead.
        error_page 502 503 504 = /_error.html;

        # T_SEC.2 — frontend now static via nginx-alpine inside container on :80.
        # No websocket upgrade needed (Vite HMR is gone in prod build).
        set $frontend_upstream "frontend:80";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
