resolver 127.0.0.11 valid=10s ipv6=off;

# T_SEC.1 — hide nginx version from response headers.
server_tokens off;

# T_SEC.1 — rate-limit zones. login is strict (brute-force target); register
# is looser (nothing to guess, and e2e smoke suite bursts N registrations).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=register_zone:10m rate=60r/m;

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name vimana.dealvault.club;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name vimana.dealvault.club;

    ssl_certificate /etc/letsencrypt/live/vimana.dealvault.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vimana.dealvault.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # T_SEC.1 — security headers on every response.
    # HSTS: force HTTPS for 1 year (includes subdomains, preload-eligible).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Clickjacking guard.
    add_header X-Frame-Options "DENY" always;
    # MIME sniffing off.
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer minimal (privacy).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions-Policy: disable browser APIs we don't need.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Content-Security-Policy: dev-permissive baseline.
    # - 'unsafe-inline' + 'unsafe-eval' in script-src: Vite dev server needs
    #   these (module bootstrapper + HMR). We serve dev-Vite as prod today.
    # - fonts.googleapis.com (style-src) + fonts.gstatic.com (font-src):
    #   Space Grotesk / Inter / IBM Plex Mono are loaded from Google Fonts
    #   per DESIGNGUIDELINES.
    # TODO(T_SEC.2): switch frontend container to serve built `dist/` via a
    #                static server, then tighten script-src to 'self' only.
    #                Also consider self-hosting the fonts to drop the Google
    #                Fonts allowlist entries.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Upload limit for DealVault attachments
    client_max_body_size 15M;

    # Retry transient upstream failures (backend restarting, DNS re-resolve, etc)
    # before returning 5xx. Works even with a single upstream — nginx re-attempts
    # the same target through DNS.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;
    proxy_connect_timeout 3s;

    # Custom "warming up" page shown while backend/frontend are still booting
    # (typical: 15-30 sec after `docker compose up`). Auto-refreshes.
    error_page 502 503 504 = /_error.html;
    location = /_error.html {
        root /etc/nginx/errors;
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # T_SEC.1 — deny common probe/scan paths at nginx level so they never
    # reach the app. Attackers routinely scan for these; keep noise out of logs.
    location ~* /\.env(\..*)?$ { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
    location ~ /\.svn { deny all; return 404; }
    location ~* \.(php|php3|php4|php5|phtml|aspx?|jsp|cgi)$ { deny all; return 404; }
    location ~* /(wp-admin|wp-login|wp-content|xmlrpc\.php) { deny all; return 404; }
    location ~ /\.ht { deny all; return 404; }

    # T_SEC.1 — brute force guard on auth endpoints (burst=5 = allow small
    # spikes, nodelay = reject overflow immediately without queueing).
    # E2E chains register→login→me so login gets called as often as register.
    location = /api/auth/login {
        limit_req zone=login_zone burst=10 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/auth/register {
        limit_req zone=register_zone burst=10 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /health stays public (docker healthcheck).
    # /docs and /openapi.json are gated by the app via EXPOSE_DOCS env — in
    # prod (`EXPOSE_DOCS=false`) FastAPI returns 404 for those paths itself.
    location ~ ^/(health|docs|redoc|openapi.json) {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $frontend_upstream "frontend:5173";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 86400;
    }
}
