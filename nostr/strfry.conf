##
## Vimana strfry relay — minimal config (T3.5 pt.1).
## Docs: https://github.com/hoytech/strfry/blob/master/strfry.conf
##
## Full auth/rate-limit/WoT-gate lands in T3.5 pt.2. For pt.1 we run the relay
## as a plain publish/subscribe endpoint; access control is enforced by our
## backend (only Vimana carriers' events get emitted).

db = "/app/strfry-db/"

relay {
    bind = "0.0.0.0"
    port = 7777

    # 0 = do not touch the limit, take whatever the container was given.
    #
    # It said 1000000, which strfry treats as a fatal error when it exceeds the
    # hard limit — 524288 here — so the relay exited with code 1 before opening
    # a socket. The value had been wrong since the container was written; it
    # only surfaced on 2026-08-01, the first time the relay was actually
    # started (T_SEC.4). A number picked to mean "as many as possible" turns
    # into a crash the moment the ceiling is lower than the wish.
    nofiles = 0
    # T_SEC.4 — clients arrive through nginx (`wss://.../relay`), so without this
    # every connection looks like it came from the proxy: strfry's per-IP limits
    # and its logs would see one address for the whole internet. Safe here
    # because the relay port is not published on the host — nothing can reach
    # strfry except nginx, so the header cannot be forged by a client.
    realIpHeader = "x-forwarded-for"

    info {
        name = "Vimana"
        description = "Sacred Logistics — trip listings (NIP-99 kind 30402)"
        pubkey = ""
        contact = ""
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        # T3.5 pt.2 — WoT-gate. Comment out to fall back to open publish.
        plugin = "/etc/write_policy.py"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        yesstr = 1
    }
}
