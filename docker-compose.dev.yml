x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    # --proxy-headers: honour X-Forwarded-Proto from nginx. Without it the app
    # believes it is on plain http and builds redirect `Location` headers as
    # `http://…` — which a browser on an https page blocks as mixed content.
    # The redirect then fails silently: the server logs a 307 and no follow-up,
    # the client sees a network error. Cost T3.14 an hour (2026-07-29).
    # --forwarded-allow-ips=*: only nginx can reach this container, it is not
    # published on the host, so trusting the forwarded headers is safe here.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips=*

  frontend:
    # T_SEC.2 — production static build served by internal nginx on :80.
    # No source volume mount: the container ships the compiled bundle only.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # T3.5 pt.2 — mount whitelist volume into celery-worker so the refresh task
  # writes to the same file strfry reads. Defined via the shared anchor below.
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - ./backend:/app
      - nostr_whitelist:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker -Q notifications,celery -l info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - celery-worker
    command: celery -A app.worker.celery_app beat -l info

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/_error.html:/etc/nginx/errors/_error.html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # T3.5 — optional strfry Nostr relay. Not started by default. Enable with:
  #   docker compose --profile nostr up -d nostr-relay
  # Then set NOSTR_OWN_RELAY_URL=ws://nostr-relay:7777 in backend .env.
  nostr-relay:
    image: dockurr/strfry:latest
    profiles: ["nostr"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "7777:7777"
    volumes:
      - ./nostr/strfry.conf:/etc/strfry.conf:ro
      - ./nostr/write_policy.py:/etc/write_policy.py:ro
      - nostr_data:/app/strfry-db
      - nostr_whitelist:/data

  # T_AGENT.1 pt.1 — optional MCP server exposing Vimana tools to AI agents.
  # Not started by default. Enable:
  #   docker compose --profile mcp up -d mcp-server
  # Then wire into Claude Desktop config (see mcp-server/README.md).
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    profiles: ["mcp"]
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      VIMANA_API_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  nostr_data:
  # T3.5 pt.2 — shared writePolicy whitelist. Backend Celery task refreshes
  # /data/allowed_pubkeys.txt hourly from the trust graph.
  nostr_whitelist:
