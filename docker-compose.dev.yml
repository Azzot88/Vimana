x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback only. Nothing outside the host talks to Postgres directly —
    # backend and workers reach it over the compose network as `db:5432`.
    # A published `5432:5432` binds 0.0.0.0, and Docker writes its own DNAT
    # rules ahead of ufw, so the host firewall does not cover it either.
    # For psql/DBeaver from a laptop: `ssh -L 5432:127.0.0.1:5432 <host>`.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Redis holds step-up grants, identity challenges, the token blacklist and
    # the Celery broker. Whoever can write to the broker queues a task, and a
    # task is code on the worker — so this one is not "just a cache".
    # `:?` fails the compose run with a named error rather than silently
    # starting an open Redis when the variable is missing.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      # redis-cli reads the password from here, so the healthcheck stays a
      # plain `ping` and the secret never lands in a process argument list.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    # Loopback only. nginx reaches the app over the compose network
    # (`backend:8000`, see nginx/default.conf), so a published port served
    # nothing but a way around nginx — and around everything nginx enforces:
    # TLS, HSTS and the rest of the T_SEC.1 headers, the probe-deny rules and
    # both `limit_req` zones. The slowapi key is `X-Forwarded-For`
    # (core/rate_limit.py), which a direct caller sets freely, so the per-IP
    # limits were bypassable by anyone who could reach :8000.
    # For Swagger while debugging: `ssh -L 8000:127.0.0.1:8000 <host>` plus
    # EXPOSE_DOCS=true, and turn both off afterwards.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    # --proxy-headers: honour X-Forwarded-Proto from nginx. Without it the app
    # believes it is on plain http and builds redirect `Location` headers as
    # `http://…` — which a browser on an https page blocks as mixed content.
    # The redirect then fails silently: the server logs a 307 and no follow-up,
    # the client sees a network error. Cost T3.14 an hour (2026-07-29).
    # --forwarded-allow-ips=*: the port is bound to loopback and the only route
    # in from outside the host is nginx, so the forwarded headers come from it.
    # No --reload: it runs a file watcher and a second copy of the app, and it
    # restarts the workers whenever a file under the mounted ./backend changes —
    # a `git pull` mid-request drops that request. Code changes now need the
    # container recreated (ENVIRONMENT §9 already prescribes `up -d --build`).
    # --workers 2: one per core (T_TEST.6, 2026-08-11). uvicorn defaults to a
    # single process, and the load run showed exactly what that costs — 100 VUs,
    # p95 949 ms against a 500 ms threshold, and **30 % of the machine idle**:
    # zero I/O wait, no swap, no sustained steal. A single-threaded process
    # cannot use more than one of two cores, so a whole core sat unused while
    # requests queued behind the one that was pinned. The giveaway was that
    # `/api/categories` — a dozen static rows — took 560 ms at the median,
    # a quarter of what the heaviest listing took. That is a queue, not a query.
    #
    # Two, not four: the box is a t3.small with 2 GB shared with Postgres,
    # Redis, nginx, the frontend and two Celery processes, and ~300 MB was free
    # under load. More workers on two cores buy context switches and memory
    # pressure, not throughput.
    #
    # Read from the environment so the number can follow the machine without a
    # commit: `UVICORN_WORKERS=4` in `.env` on a four-core box. The default is
    # the value this box wants, so nothing changes for anyone who sets nothing.
    #
    # Safe because nothing lives in process memory: rate-limit counters,
    # WebAuthn ceremonies, Nostr challenges and the token blacklist are all in
    # Redis, and there are no module-level caches. **One caveat, named rather
    # than discovered later:** `lifespan` runs `ensure_user_zero` and
    # `ensure_service_keys` per worker, so both run twice on every deploy. Both
    # are idempotent and both are wrapped in their own `try`, but two workers
    # backfilling the same account can each mint a keypair and one write wins.
    # The clean answer is to move those backfills out of startup; recorded in
    # TASKS T_TEST.6 rather than done here.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers ${UVICORN_WORKERS:-2} --proxy-headers --forwarded-allow-ips=*

  frontend:
    # T_SEC.2 — production static build served by internal nginx on :80.
    # No source volume mount: the container ships the compiled bundle only.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    healthcheck:
      # `127.0.0.1`, not `localhost`: inside the container the name resolves to
      # `::1` first, and `listen 80;` binds IPv4 only — so the probe was testing
      # an address nothing else uses and had reported unhealthy since T_SEC.2.
      # stderr is deliberately NOT swallowed. The previous `2>&1` sent wget's
      # "can't connect to remote host" to /dev/null, so `docker inspect` showed
      # 263 failures with an empty Output field and no way to tell why.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # T3.5 pt.2 — mount whitelist volume into celery-worker so the refresh task
  # writes to the same file strfry reads. Defined via the shared anchor below.
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - ./backend:/app
      - nostr_whitelist:/data
      # T_SEC.6 — MaxMind GeoLite2 City, read-only. Mounted into the **worker
      # only**: `place_for` is called from `send_new_device` and nowhere else,
      # and a 63 MB file has no business inside the API container to prove it.
      #
      # The database is not in the image and not in git — MaxMind's licence is
      # not ours to redistribute, and its refresh schedule is not our release
      # schedule. Absent file → letters go out without the location line, which
      # is a working state (see `core/geoip.py`), not a broken one.
      - ./data/geoip:/geoip:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker -Q notifications,celery -l info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - celery-worker
    command: celery -A app.worker.celery_app beat -l info

  # T_UX.9 — a fake SMTP server with a web inbox, so a letter can be looked at
  # without sending it to a person. Point SMTP_HOST at `mailpit` and SMTP_PORT
  # at 1025 in a dev `.env`; everything the app sends lands at :8025 instead of
  # the internet. Bound to loopback — reach it with `ssh -L 8025:127.0.0.1:8025`.
  # Not started in production: `docker compose up` brings it up only if asked,
  # and prod `.env` keeps SMTP_HOST on the real Mailu host.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    logging: *default-logging
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/_error.html:/etc/nginx/errors/_error.html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # T3.5 — optional strfry Nostr relay. Not started by default. Enable with:
  #   docker compose --profile nostr up -d nostr-relay
  # Then set NOSTR_OWN_RELAY_URL=ws://nostr-relay:7777 in backend .env.
  nostr-relay:
    # Pinned, not `latest`: a floating tag lets a rebuild swap the relay binary
    # under a component the roadmap calls our point of external decentralisation.
    # 1.1.1 is what `latest` resolved to at the time of pinning (2026-07-21).
    image: dockurr/strfry:1.1.1
    profiles: ["nostr"]
    restart: unless-stopped
    logging: *default-logging
    # No published port (T_SEC.4). The relay is reached over TLS through nginx
    # at `wss://<host>/relay`; plain `ws://` on 7777 was unusable from any web
    # client anyway (mixed content), and leaving it open would be a second door
    # into the relay that skips the rate-limit zone and the real-IP header.
    expose:
      - "7777"
    volumes:
      - ./nostr/strfry.conf:/etc/strfry.conf:ro
      - ./nostr/write_policy.py:/etc/write_policy.py:ro
      - nostr_data:/app/strfry-db
      - nostr_whitelist:/data

  # T3.8 follow-up — malware scanning for uploads.
  #
  # Behind a profile because it is genuinely expensive: clamd loads the full
  # signature database into memory and wants ~1.5–2 GB of RAM to itself. On an
  # instance sized for the rest of this stack that is not a rounding error, so
  # it starts only when asked for:
  #
  #   docker compose -f docker-compose.dev.yml --profile clamav up -d clamav
  #
  # and the backend only talks to it once `CLAMAV_HOST=clamav` is in `.env`.
  # The profile decides whether the scanner exists; `CLAMAV_HOST` decides where
  # to find it. Neither can break an upload: a missing or unreachable scanner
  # queues the file instead (owner's decision 2026-08-02), so the worst outcome
  # of a misconfiguration is a growing queue and an hourly alert, not a product
  # that stops accepting files.
  clamav:
    # Pinned for the same reason as the relay: a floating tag would let a
    # rebuild swap a security control under us.
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    restart: unless-stopped
    logging: *default-logging
    # Internal only. Nothing outside the compose network has any business
    # talking to clamd (T_SEC.3).
    expose:
      - "3310"
    volumes:
      # Signatures survive restarts. Without this every start re-downloads
      # roughly a gigabyte from the mirrors, which is slow and rude.
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      # Generous: the first start downloads the database before clamd answers
      # anything, and marking it unhealthy in the meantime helps nobody.
      start_period: 300s
      retries: 5

  # T_AGENT.1 pt.1 — optional MCP server exposing Vimana tools to AI agents.
  # Not started by default. Enable:
  #   docker compose --profile mcp up -d mcp-server
  # Then wire into Claude Desktop config (see mcp-server/README.md).
  # `mcp-server` удалён 2026-07-30 — см. T7.1.
  #
  # `server.py` работает по stdio: клиент сам запускает сервер дочерним
  # процессом и общается с ним через пайпы. Как сервис в compose он получал
  # закрытый stdin, читал EOF, выходил с кодом 0 и поднимался снова — одиннадцать
  # дней `Restarting (0)` при пустом `logs`, потому что сбоя не было.
  #
  # `stdin_open: true` это не чинит: stdin откроется, но писать в него некому —
  # снаружи до него нет пути. Пока транспорт stdio, контейнер нужен только как
  # образ (`docker exec -i` с той же машины), но не как запущенный сервис.
  # Возвращать сюда — только вместе с сетевым транспортом (вариант A в T7.1).

  # T_TEST.6 — k6 load scenarios. Never part of `up`: it is a tool you point at
  # a host, not a service that runs.
  #
  #   docker compose -f docker-compose.dev.yml --profile load run --rm \
  #     -e BASE_URL=https://<staging-host> k6 run /load/scripts/browse_trips.js
  #
  # The whole `load/` directory is mounted (rw) rather than the scripts alone:
  # the scenarios import `../lib/`, the summary reads `../baseline.json`, and
  # results are written back next to it. Mounting the pieces separately made
  # those three relative paths mean three different things.
  #
  # Floating tag, like ZAP and for the same reason — this is invoked by hand,
  # not run under us. It matters here in one way: a k6 upgrade can move the
  # numbers, so a baseline worth keeping records the version it was taken with
  # and pins it back via K6_IMAGE.
  k6:
    image: ${K6_IMAGE:-grafana/k6:latest}
    profiles: ["load"]
    logging: *default-logging
    # The image runs as its own `k6` user (uid 12345), which cannot write into a
    # host directory owned by the deploy user — the first run produced every
    # number and then lost the file to `permission denied`. Matching the host
    # owner keeps the written summary editable afterwards, which matters because
    # recording a baseline is `cp`-ing that very file.
    user: "${K6_USER:-1000:1000}"
    volumes:
      - ./load:/load
    # No `depends_on`: the target is a URL, and usually not this machine.

volumes:
  postgres_data:
  nostr_data:
  # T3.5 pt.2 — shared writePolicy whitelist. Backend Celery task refreshes
  # /data/allowed_pubkeys.txt hourly from the trust graph.
  nostr_whitelist:
  # T3.8 — clamd signature database. Persisted so a restart does not re-download
  # ~1 GB from the mirrors.
  clamav_db:
