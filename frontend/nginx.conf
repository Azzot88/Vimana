# T_SEC.2 — internal nginx of the frontend container. Only serves static
# files; the outer nginx-1 is the public edge (TLS, rate-limits, CSP).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived cache for hashed asset filenames (Vite: /assets/*-hash.js/css/png).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }


    # T_UX.7 pt.2 — the root serves the prerendered landing.
    #
    # `landing.html` is `index.html` with the landing already rendered into
    # `#root` at build time, so a crawler (or anyone whose JavaScript has not
    # arrived yet) reads the actual page instead of an empty div. The app bundle
    # is the same one, and hydrates over it.
    #
    # Exact-match `= /` on purpose: putting the markup into `index.html` would
    # ship it to every route, and someone opening `/login` would watch the
    # landing flash past before hydration replaced it. Falls back to the shell
    # if the prerender step did not run, so a partial build degrades to the old
    # behaviour rather than a 404.
    # `no-cache` on both HTML entry points (2026-08-04).
    #
    # The document carries the asset hashes, so a stale copy pins the browser to
    # a *previous* build for as long as it lives — and it lived: nothing here
    # sent `Cache-Control` for HTML at all, and browsers then fall back to
    # heuristic caching off `Last-Modified`. That is how a deploy is correct on
    # the server and invisible on the screen. Assets are `immutable` **by name**,
    # so the only document that can point at the new ones is this one, and it is
    # the one thing that must never be served from cache without asking.
    #
    # `no-cache` is not "do not store": the copy is kept and revalidated against
    # `ETag`, so an unchanged page still answers 304 and costs a round trip, not
    # a download.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /landing.html /index.html;
    }

    # T_UX.23 — the three audience pages, same deal as the root.
    #
    # Each is prerendered to its own file by `scripts/prerender.mjs`. Without
    # these blocks they would fall through to the SPA rule below and be served
    # as the empty shell — the pages would still work for a person, and be blank
    # for every crawler. Since the entire point of splitting the landing by
    # audience is to be found by three different searches, that would quietly
    # undo the task.
    #
    # `/carrier` and `/send` are one address showing two screens: the file here
    # is the guest half, and a signed-in visitor's bundle replaces it on
    # hydration. Serving the guest markup to everyone is correct — it is what
    # the client renders too until the session is read.
    #
    # Exact matches, so `/carrier` is prerendered while `/carriers/<id>` (a
    # different page entirely) keeps falling through to the SPA rule.
    location = /carrier {
        add_header Cache-Control "no-cache" always;
        try_files /carrier.html /index.html;
    }

    location = /send {
        add_header Cache-Control "no-cache" always;
        try_files /send.html /index.html;
    }

    location = /business {
        add_header Cache-Control "no-cache" always;
        try_files /business.html /index.html;
    }

    # T3.11.03 — the public rules directory.
    #
    # A regex rather than exact matches, because these paths are not a list in
    # the source: they are whatever the editor has published. The prerender step
    # writes `rules-<category>-<direction>-<country>.html` for each one.
    #
    # **T_OPS.2 replaced variant A here.** These pages used to be files written
    # at build time, which meant a rule published after the last deploy was
    # invisible to a crawler until the next one. They are now rendered per
    # request by the `ssr` process from the current state of the database, so
    # publishing and being visible are one event. The files remain as the
    # fallback below.
    #
    # The trailing slash is optional in the pattern so `/rules/art/export/ru`
    # and `/rules/art/export/ru/` are the same page rather than one page and
    # one 404 — the difference nobody types on purpose.
    # T_OPS.2 — these two now go to the SSR process, not to a file.
    #
    # `resolver` plus a **variable** upstream on purpose. With a literal
    # `proxy_pass http://ssr:3000`, nginx resolves the name once at config load
    # and refuses to start when the container is not up yet — which would mean
    # the whole site fails to boot because one auxiliary process is late. With a
    # variable the name is resolved per request through Docker's embedded DNS,
    # so an absent `ssr` is a 502, and a 502 is something we can answer.
    #
    # Timeouts are short. This is a page, not a job: waiting ten seconds to
    # discover the renderer is wedged is worse for the reader than falling
    # straight through to the file.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /rules {
        add_header Cache-Control "no-cache" always;
        set $ssr_upstream "http://ssr:3000";
        proxy_pass $ssr_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        # Only the codes listed below are intercepted, so a genuine 404 from
        # the renderer still reaches the reader as a 404.
        proxy_intercept_errors on;
        error_page 502 503 504 = @rules_index_file;
    }

    # The floor, not the delivery mechanism. `scripts/prerender.mjs` still
    # writes these files every build; they are what the reader gets if the SSR
    # process is down, and past them the SPA shell, which is what the reader got
    # before any of this existed.
    location @rules_index_file {
        add_header Cache-Control "no-cache" always;
        try_files /rules-index.html /index.html;
    }

    location ~ ^/rules/([^/]+)/([^/]+)/([^/]+)/?$ {
        add_header Cache-Control "no-cache" always;
        # Captured before the proxy, because a named location does not inherit
        # the regex captures and $1..$3 would be empty there.
        set $rules_file "/rules-$1-$2-$3.html";
        set $ssr_upstream "http://ssr:3000";
        proxy_pass $ssr_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @rules_corridor_file;
    }

    location @rules_corridor_file {
        add_header Cache-Control "no-cache" always;
        try_files $rules_file /index.html;
    }

    # SPA fallback: React Router owns the URL space, unknown paths hit index.html.
    # Same header, same reason — plus the unhashed root files (`vimana.svg`,
    # `robots.txt`) live here, and their names never change either.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Health probe for docker-compose healthcheck.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
