# T_SEC.2 — internal nginx of the frontend container. Only serves static
# files; the outer nginx-1 is the public edge (TLS, rate-limits, CSP).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived cache for hashed asset filenames (Vite: /assets/*-hash.js/css/png).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }


    # T_UX.7 pt.2 — the root serves the prerendered landing.
    #
    # `landing.html` is `index.html` with the landing already rendered into
    # `#root` at build time, so a crawler (or anyone whose JavaScript has not
    # arrived yet) reads the actual page instead of an empty div. The app bundle
    # is the same one, and hydrates over it.
    #
    # Exact-match `= /` on purpose: putting the markup into `index.html` would
    # ship it to every route, and someone opening `/login` would watch the
    # landing flash past before hydration replaced it. Falls back to the shell
    # if the prerender step did not run, so a partial build degrades to the old
    # behaviour rather than a 404.
    # `no-cache` on both HTML entry points (2026-08-04).
    #
    # The document carries the asset hashes, so a stale copy pins the browser to
    # a *previous* build for as long as it lives — and it lived: nothing here
    # sent `Cache-Control` for HTML at all, and browsers then fall back to
    # heuristic caching off `Last-Modified`. That is how a deploy is correct on
    # the server and invisible on the screen. Assets are `immutable` **by name**,
    # so the only document that can point at the new ones is this one, and it is
    # the one thing that must never be served from cache without asking.
    #
    # `no-cache` is not "do not store": the copy is kept and revalidated against
    # `ETag`, so an unchanged page still answers 304 and costs a round trip, not
    # a download.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /landing.html /index.html;
    }

    # T_UX.23 — the three audience pages, same deal as the root.
    #
    # Each is prerendered to its own file by `scripts/prerender.mjs`. Without
    # these blocks they would fall through to the SPA rule below and be served
    # as the empty shell — the pages would still work for a person, and be blank
    # for every crawler. Since the entire point of splitting the landing by
    # audience is to be found by three different searches, that would quietly
    # undo the task.
    #
    # `/carrier` and `/send` are one address showing two screens: the file here
    # is the guest half, and a signed-in visitor's bundle replaces it on
    # hydration. Serving the guest markup to everyone is correct — it is what
    # the client renders too until the session is read.
    #
    # Exact matches, so `/carrier` is prerendered while `/carriers/<id>` (a
    # different page entirely) keeps falling through to the SPA rule.
    location = /carrier {
        add_header Cache-Control "no-cache" always;
        try_files /carrier.html /index.html;
    }

    location = /send {
        add_header Cache-Control "no-cache" always;
        try_files /send.html /index.html;
    }

    location = /business {
        add_header Cache-Control "no-cache" always;
        try_files /business.html /index.html;
    }

    # SPA fallback: React Router owns the URL space, unknown paths hit index.html.
    # Same header, same reason — plus the unhashed root files (`vimana.svg`,
    # `robots.txt`) live here, and their names never change either.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Health probe for docker-compose healthcheck.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
