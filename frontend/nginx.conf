# T_SEC.2 — internal nginx of the frontend container. Only serves static
# files; the outer nginx-1 is the public edge (TLS, rate-limits, CSP).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived cache for hashed asset filenames (Vite: /assets/*-hash.js/css/png).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # T_UX.7 pt.2 — the root serves the prerendered landing.
    #
    # `landing.html` is `index.html` with the landing already rendered into
    # `#root` at build time, so a crawler (or anyone whose JavaScript has not
    # arrived yet) reads the actual page instead of an empty div. The app bundle
    # is the same one, and hydrates over it.
    #
    # Exact-match `= /` on purpose: putting the markup into `index.html` would
    # ship it to every route, and someone opening `/login` would watch the
    # landing flash past before hydration replaced it. Falls back to the shell
    # if the prerender step did not run, so a partial build degrades to the old
    # behaviour rather than a 404.
    location = / {
        try_files /landing.html /index.html;
    }

    # SPA fallback: React Router owns the URL space, unknown paths hit index.html.
    location / {
        try_files $uri /index.html;
    }

    # Health probe for docker-compose healthcheck.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
