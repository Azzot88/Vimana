# T_TEST.10 — mutation testing.
#
# Config lives in a file rather than on the command line because mutmut 3
# dropped `--paths-to-mutate`. Version 3 and not the 2.x the task text was
# written against: 2.x depends on `pony`, which does not build on the
# Python 3.12 of our image.
#
# ── Why only these two modules ────────────────────────────────────────────
#
# Narrowed by owner decision 2026-08-12, on one criterion: the price of a weak
# test. In `permissions` a weak test means somebody sees an account that hid
# itself; in `threshold` it means a share is reconstructed with the wrong key.
# Everywhere else a logic error is loud and an ordinary test finds it.
#
# `paths_to_mutate` holds one module at a time on purpose — the acceptance
# criterion (kill-rate >= 60 %) is per module, and the runner below is chosen
# for the module named here. Swap both lines together when moving to
# `threshold`, or the run will report survivors that are simply untested by
# the files listed.
#
# ── Why the runner is narrowed ────────────────────────────────────────────
#
# mutmut re-runs the suite once per mutant. The full suite is ~1750 tests and
# seven minutes, so a few hundred mutants would be days. Listed here are the
# files that actually exercise this module, cheapest first: `-x` stops at the
# first failure, so a mutant covered by the pure-unit file dies in seconds and
# never reaches the ones that need a database.
#
# The cost of narrowing is false survivors — a mutant these files miss but the
# full suite would catch. That is why a survivor is a *candidate*, not a
# finding: re-run the full suite against it before writing a test for it.
[mutmut]
paths_to_mutate = app/core/permissions.py
tests_dir = tests/
runner = python -m pytest -x -q -p no:cacheprovider --assert=plain tests/test_permissions.py tests/test_identity_establish.py tests/test_recipient.py tests/test_verification.py tests/test_trust_graph.py
