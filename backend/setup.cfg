# T_TEST.10 — mutation testing.
#
# Config lives in a file because mutmut 3 dropped `--paths-to-mutate`, and
# version 3 rather than the 2.x the task text was written against: 2.x depends
# on `pony`, which does not build on the Python 3.12 of our image.
#
# ── Why only these two modules ────────────────────────────────────────────
#
# Narrowed by owner decision 2026-08-12, on one criterion: the price of a weak
# test. In `permissions` a weak test means somebody sees an account that hid
# itself; in `threshold` it means a share is reconstructed with the wrong key.
# Everywhere else a logic error is loud and an ordinary test finds it.
#
# ── How narrowing actually works here ─────────────────────────────────────
#
# Two different keys, and the distinction is the whole reason the first three
# attempts failed:
#
#   `source_paths`  — what gets **copied** into `mutants/`, where the suite is
#                     then run. This has to be the whole package. Pointing it
#                     at the single module copies only that file, and the first
#                     import in `conftest.py` dies on `app.core.config`.
#   `only_mutate`   — an fnmatch over the path, deciding what gets **mutated**.
#                     This is the narrowing knob.
#
# There is deliberately no test selection here. mutmut 3 runs the suite once up
# front to record which test touches which line, then gives each mutant only
# the tests that cover it. Listing files by hand — the obvious thing, and what
# this file did at first — is both unnecessary and harmful: it starves that
# stats pass and every mutant the omitted files would have killed is reported
# as a survivor. We pay one full-suite run at the start instead.
#
# ── Two traps in the file format ──────────────────────────────────────────
#
# List values split on **newlines**, never on spaces (`configuration.py`:
# `if "\n" in result`). Space-separated paths arrive as one long argument, and
# pytest reports a missing file with no hint as to why.
#
# `also_copy` has defaults — `tests/`, `setup.cfg`, the lockfiles — and
# `pytest.ini` is not among them. Without it the copy loses `asyncio_mode =
# auto` and every async test fails on arrival, which would read as "the mutant
# killed everything" for all several hundred of them.
#
# Turn `debug` back on the moment a run fails to start. Without it mutmut
# swallows pytest's output and reports only a
# `BadTestExecutionCommandsException`, which says the command failed but not
# why — three of the four false starts here were diagnosed by that one switch.
#
# ── One module at a time ──────────────────────────────────────────────────
#
# `only_mutate` names the module under test; move it to run the other one. The
# acceptance criterion is per module, and results do not carry over — mutant
# numbering is not stable between runs, so `x_visible_to__mutmut_5` from an
# earlier report is not the same mutation today. Read survivors from the diffs
# `mutmut show` prints, never from a remembered index.
#
# `permissions.py`, 2026-08-23: 72 mutants, 63 killed, 87.5 %. Nine survivors,
# none of them a behaviour change — three false (the `require_perm` factory
# runs at import), two equivalent, four rewording an error `detail`. Written up
# in TASKS `T_TEST.10`.
[mutmut]
source_paths = app
only_mutate = app/core/threshold.py
also_copy = pytest.ini
debug = false
