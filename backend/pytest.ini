[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
markers =
    fuzz: schemathesis/hypothesis contract fuzz — slow (~1.5-2 min). Daily runs may use `pytest -m "not fuzz"`; the FULL suite (no filter) stays mandatory before closing any task.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:botocore\..*
    # T_TEST.4 — schemathesis 3.39 still imports deprecated jsonschema APIs
    # at module load. Filtered here so it fires before schemathesis is
    # imported by any test file.
    ignore:.*RefResolutionError.*:DeprecationWarning
    ignore:.*RefResolver.*:DeprecationWarning
    ignore:.*call_asgi.*:DeprecationWarning:schemathesis\..*
    # T3.15 — `redis.asyncio` finalizers firing on a dead loop.
    #
    # schemathesis drives the ASGI app from sync code, which spins up a fresh
    # event loop per request. Each one gets its own Redis client (the pool is
    # keyed by loop), and when the GC later collects the connection its
    # `__del__` calls `loop.call_soon()` on a loop that is long closed.
    # Collection is GC-timed, so the traceback lands next to whichever test
    # happens to be running — which is why it reads as random.
    #
    # `\x3a` is a colon. It cannot be written literally: pytest parses this
    # value by splitting on `:` into action/message/category, so a raw colon
    # inside the message would be read as a field separator.
    #
    # Named down to the exact finalizer on purpose. The previous attempt used
    # `sys.unraisablehook`, which never ran at all: pytest's own
    # `unraisableexception` plugin replaces that hook around every test item,
    # so a hook installed from conftest is only in place between tests. Nothing
    # about production changes either way — a server has one long-lived loop
    # and never reaches this path.
    ignore:Exception ignored in\x3a <function AbstractConnection\.__del__:pytest.PytestUnraisableExceptionWarning
